<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">UUID 与 superset 双边存储</title>
  <desc id="desc">供应商数据库、Harbor profile 库和 Claude configLibrary 通过 UUID 关联，sidecar 派生 Claude profile。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172b3a}
      .heading{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172b3a;text-anchor:middle}
      .box{fill:#f5f9fc;stroke:#315b7d;stroke-width:2;rx:12}
      .meta{fill:#edf3e8;stroke:#5f7746;stroke-width:2;rx:12}
      .derived{fill:#f7f1e8;stroke:#8b6239;stroke-width:2;rx:12}
      .text{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263e50;text-anchor:middle}
      .small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#536879;text-anchor:middle}
      .arrow{fill:none;stroke:#315b7d;stroke-width:2.3;marker-end:url(#arrow)}
      .ref{fill:none;stroke:#6f7f8e;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .caption{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#586d7d}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="50" y="52" class="title">身份、索引与派生配置</text>

  <text x="200" y="105" class="heading">独立供应商数据库</text>
  <text x="600" y="105" class="heading">Harbor profile 库</text>
  <text x="990" y="105" class="heading">Claude configLibrary</text>

  <rect x="45" y="140" width="310" height="120" class="meta"/>
  <text x="200" y="177" class="text">providers/_meta.json</text>
  <text x="200" y="207" class="small">entries: [{ id, name }]</text>
  <text x="200" y="233" class="small">显示名与顺序的唯一存放处</text>

  <rect x="45" y="390" width="310" height="160" class="box"/>
  <text x="200" y="427" class="text">&lt;provider-UUID&gt;.json</text>
  <text x="200" y="457" class="small">baseUrl + apiKey + authScheme</text>
  <text x="200" y="483" class="small">文件名即身份；内容不重复存 ID</text>
  <text x="200" y="509" class="small">权限 0600；不存模型</text>

  <rect x="445" y="140" width="310" height="120" class="meta"/>
  <text x="600" y="177" class="text">profiles/_meta.json</text>
  <text x="600" y="207" class="small">entries + 本地 appliedId 镜像</text>
  <text x="600" y="233" class="small">可从 sidecar 目录重建索引</text>

  <rect x="445" y="330" width="310" height="220" class="box"/>
  <text x="600" y="367" class="text">&lt;profile-UUID&gt;.json</text>
  <text x="600" y="397" class="small">superset sidecar</text>
  <text x="600" y="425" class="small">inferenceModels + claude 透传块</text>
  <text x="600" y="451" class="small">provider UUID + upstreamModel</text>
  <text x="600" y="477" class="small">advanced：port + token + scheme</text>
  <text x="600" y="509" class="small">standard / advanced / readOnly</text>

  <rect x="835" y="140" width="310" height="120" class="meta"/>
  <text x="990" y="177" class="text">Claude _meta.json</text>
  <text x="990" y="207" class="small">entries + 真正的 appliedId</text>
  <text x="990" y="233" class="small">profile 主列表与激活指针</text>

  <rect x="835" y="330" width="310" height="180" class="derived"/>
  <text x="990" y="367" class="text">&lt;profile-UUID&gt;.json</text>
  <text x="990" y="397" class="small">Desktop 所需的派生子集</text>
  <text x="990" y="425" class="small">删除 provider / upstreamModel</text>
  <text x="990" y="451" class="small">advanced 只指向本地网关</text>
  <text x="990" y="477" class="small">Desktop 可重写键序并密封凭证</text>

  <path d="M200 260 L200 390" class="arrow"/>
  <path d="M600 260 L600 330" class="arrow"/>
  <path d="M990 260 L990 330" class="arrow"/>
  <path d="M755 410 L835 410" class="arrow"/>
  <text x="795" y="392" class="small">generate</text>

  <path d="M500 330 L285 260" class="ref"/>
  <text x="365" y="288" class="small">provider UUID 引用</text>
  <path d="M755 180 L835 180" class="ref"/>
  <text x="795" y="164" class="small">同一 UUID</text>
  <path d="M755 500 L835 500" class="ref"/>
  <text x="795" y="526" class="small">同名文件</text>

  <rect x="45" y="620" width="1100" height="85" fill="#f8fafb" stroke="#d4dee5" rx="10"/>
  <text x="65" y="653" class="caption">不变量：受管 profile 两侧使用同一 UUID；显示名不是关联键；Claude 元数据是主列表；sidecar 是受管文件的生成底账。</text>
  <text x="65" y="681" class="caption">实线表示索引或派生关系；虚线表示跨存储引用。单文件写入是原子的，多文件与双侧操作不构成事务。</text>
</svg>
