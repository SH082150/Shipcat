<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">UUID references and superset dual storage</title>
  <desc id="desc">The provider datastore, Harbor profile store, and Claude configLibrary are linked by UUIDs; managed sidecars generate Claude profile subsets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#315b7d"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172b3a}.heading{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172b3a;text-anchor:middle}
      .box{fill:#f5f9fc;stroke:#315b7d;stroke-width:2;rx:12}.meta{fill:#edf3e8;stroke:#5f7746;stroke-width:2;rx:12}.derived{fill:#f7f1e8;stroke:#8b6239;stroke-width:2;rx:12}
      .text{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263e50;text-anchor:middle}.small{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#536879;text-anchor:middle}
      .arrow{fill:none;stroke:#315b7d;stroke-width:2.3;marker-end:url(#arrow)}.ref{fill:none;stroke:#6f7f8e;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.caption{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#586d7d}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/><text x="50" y="52" class="title">Identity, indexes, and derived configuration</text>
  <text x="200" y="105" class="heading">Provider datastore</text><text x="600" y="105" class="heading">Harbor profile store</text><text x="990" y="105" class="heading">Claude configLibrary</text>
  <rect x="45" y="140" width="310" height="120" class="meta"/><text x="200" y="177" class="text">providers/_meta.json</text><text x="200" y="207" class="small">entries: [{ id, name }]</text><text x="200" y="233" class="small">Display names and ordering</text>
  <rect x="45" y="390" width="310" height="160" class="box"/><text x="200" y="427" class="text">&lt;provider-UUID&gt;.json</text><text x="200" y="457" class="small">baseUrl + apiKey + authScheme</text><text x="200" y="483" class="small">Filename is identity; no repeated ID</text><text x="200" y="509" class="small">Mode 0600; no model entries</text>
  <rect x="445" y="140" width="310" height="120" class="meta"/><text x="600" y="177" class="text">profiles/_meta.json</text><text x="600" y="207" class="small">entries + local appliedId mirror</text><text x="600" y="233" class="small">Index rebuild from sidecar directory</text>
  <rect x="445" y="330" width="310" height="220" class="box"/><text x="600" y="367" class="text">&lt;profile-UUID&gt;.json</text><text x="600" y="397" class="small">Superset sidecar</text><text x="600" y="425" class="small">inferenceModels + Claude passthrough</text><text x="600" y="451" class="small">provider UUID + upstreamModel</text><text x="600" y="477" class="small">advanced: port + token + scheme</text><text x="600" y="509" class="small">standard / advanced / readOnly</text>
  <rect x="835" y="140" width="310" height="120" class="meta"/><text x="990" y="177" class="text">Claude _meta.json</text><text x="990" y="207" class="small">entries + effective appliedId</text><text x="990" y="233" class="small">Primary profile list and active pointer</text>
  <rect x="835" y="330" width="310" height="180" class="derived"/><text x="990" y="367" class="text">&lt;profile-UUID&gt;.json</text><text x="990" y="397" class="small">Derived Desktop subset</text><text x="990" y="425" class="small">Remove provider / upstreamModel</text><text x="990" y="451" class="small">advanced points to local gateway</text><text x="990" y="477" class="small">Desktop may reorder and seal values</text>
  <path d="M200 260 L200 390" class="arrow"/><path d="M600 260 L600 330" class="arrow"/><path d="M990 260 L990 330" class="arrow"/>
  <path d="M755 410 L835 410" class="arrow"/><text x="795" y="392" class="small">generate</text>
  <path d="M500 330 L285 260" class="ref"/><text x="365" y="288" class="small">provider UUID reference</text>
  <path d="M755 180 L835 180" class="ref"/><text x="795" y="164" class="small">same UUID</text><path d="M755 500 L835 500" class="ref"/><text x="795" y="526" class="small">same filename</text>
  <rect x="45" y="620" width="1100" height="85" fill="#f8fafb" stroke="#d4dee5" rx="10"/>
  <text x="65" y="653" class="caption">Invariants: managed profiles share one UUID; names are not reference keys; Claude metadata is the primary list.</text>
  <text x="65" y="681" class="caption">Solid: index or derivation. Dashed: cross-store reference. Single-file writes are atomic; dual-side operations are not transactions.</text>
</svg>
